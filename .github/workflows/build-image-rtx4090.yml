name: Build ComfyUI USB/ISO for RTX 4090 + WiFi

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # This image (kernel + NVIDIA driver + CUDA toolkit + PyTorch) is large
      # enough that the runner's default free disk (~14GB) isn't enough once
      # you also need room for docker export + squashfs on top of it - hit
      # "No space left on device" 9% into mksquashfs on run 36058400757.
      # Reclaim space from preinstalled toolchains this job never uses.
      - name: Free up runner disk space
        run: |
          echo "Before:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL \
            /opt/az /usr/lib/jvm || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          docker image prune -af || true
          echo "After:" && df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (RTX 4090 + WiFi)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: comfyui-rtx4090:latest
          # GHA layer caching disabled while this Dockerfile is still being
          # iterated on: a mode=max cache export/import for this multi-GB
          # image (kernel + NVIDIA driver + CUDA toolkit + PyTorch) hung for
          # 38+ minutes on run 36054049293 without erroring. Re-add once the
          # file is stable if build time becomes worth optimizing.

      - name: Export Docker container filesystem
        run: |
          echo "Starting container export..."
          docker run --privileged --name comfyui-export -d comfyui-rtx4090:latest sleep infinity

          echo "Exporting + extracting filesystem (piped, no intermediate .tar on disk)..."
          mkdir -p rootfs
          docker export comfyui-export | sudo tar -xp -C rootfs/ --same-owner

          echo "Cleaning up..."
          docker stop comfyui-export
          docker rm comfyui-export
          # Drop the now-redundant image layers too - only the extracted
          # rootfs/ is needed from here on, and disk is tight.
          docker image rm comfyui-rtx4090:latest || true
          docker builder prune -af || true

          echo "Filesystem ready: $(du -sh rootfs | awk '{print $1}')"
          df -h /

      - name: Install ISO build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            grub-pc-bin grub-efi-amd64-bin grub-common \
            mtools xorriso squashfs-tools

      - name: Build bootable live ISO (BIOS + UEFI, dd-able to USB)
        run: |
          set -e
          echo "Locating kernel + initrd produced by live-boot (see Dockerfile)..."
          KERNEL=$(sudo find rootfs/boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -1)
          INITRD=$(sudo find rootfs/boot -maxdepth 1 -name 'initrd.img-*-generic' | sort -V | tail -1)
          if [ -z "$KERNEL" ] || [ -z "$INITRD" ]; then
            echo "::error::Could not find a generated kernel/initrd under rootfs/boot. Did linux-image-generic install correctly?"
            sudo ls -la rootfs/boot
            exit 1
          fi
          echo "Kernel: $KERNEL"
          echo "Initrd: $INITRD"

          echo "Building squashfs of the rootfs (this is the actual live root filesystem)..."
          mkdir -p iso/live iso/boot/grub
          sudo mksquashfs rootfs iso/live/filesystem.squashfs -comp xz -e boot

          sudo cp "$KERNEL" iso/live/vmlinuz
          sudo cp "$INITRD" iso/live/initrd.img
          sudo chown "$(id -u):$(id -g)" iso/live/vmlinuz iso/live/initrd.img iso/live/filesystem.squashfs

          echo "Writing GRUB configuration (boot=live is handled by live-boot, installed in the image)..."
          cat > iso/boot/grub/grub.cfg <<'EOF'
          set default=0
          set timeout=10

          menuentry "ComfyUI Server (RTX 4090 + WiFi)" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd.img
          }

          menuentry "ComfyUI Server (Verbose)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF

          echo "Building hybrid ISO/USB image with grub-mkrescue..."
          # filesystem.squashfs is >4GiB (plain ISO9660's hard per-file
          # limit, "File exceeds size limit of 4294967295 bytes" on run
          # 36061838538) - iso-level 3 turns on multi-extent files so
          # xorriso can store it. Args after -- pass straight through to
          # the underlying xorriso call.
          grub-mkrescue -o comfyui-rtx4090.iso iso/ -- -iso-level 3

          echo "Image created: $(ls -lh comfyui-rtx4090.iso | awk '{print $5}')"
          echo "This single .iso is a hybrid image: burn it to optical media, or"
          echo "'dd' it directly to a USB stick (sudo dd if=comfyui-rtx4090.iso of=/dev/sdX bs=4M status=progress)."

      - name: Compress image
        run: |
          gzip -v comfyui-rtx4090.iso
          ls -lh comfyui-rtx4090.iso.gz

      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-rtx4090-usb-images
          path: comfyui-rtx4090.iso.gz
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event.inputs.release == 'true' || startsWith(github.ref, 'refs/tags/')
        with:
          files: comfyui-rtx4090.iso.gz
          draft: false
          prerelease: startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'beta')
          body: |
            # ComfyUI RTX 4090 WiFi Boot Image

            **Build Date:** ${{ github.event.head_commit.timestamp }}
            **GPU:** NVIDIA RTX 4090 (Ada Lovelace)
            **Network:** WiFi + Ethernet support

            ## Downloads

            - **comfyui-rtx4090.iso.gz** - Hybrid ISO/USB image (burn to optical media, or `dd` straight to a USB stick)

            ## Quick Start

            ### macOS/Linux
            ```bash
            gunzip comfyui-rtx4090.iso.gz
            diskutil list                    # Find USB device
            diskutil unmountDisk /dev/diskX
            sudo dd if=comfyui-rtx4090.iso of=/dev/rdiskX bs=4m
            ```

            ### Windows
            1. Extract .iso.gz with 7-Zip or WinRAR
            2. Download [Balena Etcher](https://www.balena.io/etcher/)
            3. Write ISO to USB (Etcher writes hybrid ISOs to USB correctly)

            ## What's Inside

            ✅ Ubuntu 24.04 live image (squashfs, via live-boot)
            ✅ ComfyUI latest
            ✅ NVIDIA CUDA 12.5 toolkit/driver (RTX 4090 optimized)
            ✅ PyTorch cu124 wheels
            ✅ WPA2 WiFi support (wpa_supplicant + NetworkManager)
            ✅ SSH enabled
            ✅ Auto-start ComfyUI on boot

            ## First Boot

            1. **Boot from USB** → wait 30-60 seconds
            2. **Setup WiFi** → SSH and run `/usr/local/bin/setup-wifi.sh`
            3. **Check GPU** → `ssh root@<ip>` then `nvidia-smi`
            4. **Access UI** → http://<server-ip>:8188

            ## Default Credentials
            ```
            Username: root
            Password: comfyui
            ```
            ⚠️ **CHANGE IMMEDIATELY AFTER BOOT!**

            ## Customize

            Edit `Dockerfile` before pushing:
            - WiFi SSID/password
            - Root password
            - ComfyUI flags (--highvram, etc)

            ## Support

            - 📖 See WIFI_AND_GPU_SETUP.md for detailed WiFi/GPU guide
            - 🐛 Issues: Check journalctl logs on server
            - 💬 ComfyUI Discord: https://discord.gg/comfyorg

            ---

            Generated with GitHub Actions on Christoffer's infrastructure ⚡
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Summary
        run: |
          echo "=========================================="
          echo "✅ Build Complete!"
          echo "=========================================="
          echo ""
          echo "Files:"
          ls -lh comfyui-rtx4090.* | awk '{printf "  %s (%s)\n", $9, $5}'
          echo ""
          echo "Next steps:"
          echo "  1. Download from Actions → Artifacts"
          echo "  2. Extract .iso.gz file"
          echo "  3. Write to USB with dd or Balena Etcher"
          echo "  4. Boot server and setup WiFi"
          echo ""
          echo "Access: http://<server-ip>:8188"
          echo "SSH: ssh root@<server-ip>"
          echo "=========================================="
