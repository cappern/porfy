name: DEBUG grub-mkrescue large file test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools xorriso

      - name: Build fake >4GiB sparse file + minimal iso tree
        run: |
          mkdir -p iso/live iso/boot/grub
          truncate -s 4400M iso/live/filesystem.squashfs
          truncate -s 1M iso/live/vmlinuz
          truncate -s 1M iso/live/initrd.img
          cat > iso/boot/grub/grub.cfg <<'EOF'
          set default=0
          set timeout=10
          menuentry "test" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF
          ls -lh iso/live

      - name: "Attempt A: no --, mkisofs-emulation -iso-level 3"
        run: |
          set -x
          grub-mkrescue -o /tmp/a.iso iso/ -iso-level 3
          ls -lh /tmp/a.iso
